experience_level_filter_prompt: |
  You are an AI assistant that predicts the experience level of a job posting.
  Given the job title and description, determine the experience level from the following options: {experience_levels}.

  Job Title: {title}
  Job Description: {description}

  Experience Level:

resume_match_prompt: |
  You are an AI assistant that matches job postings to a candidate's resume.
  Given the candidate's skills and a job posting, determine how well the job matches the candidate's skills.

  Candidate Skills: {resume_skills}

  Job Title: {title}
  Job Description: {description}

  Provide a match score between 0.0 and 1.0, where:
  - 1.0 means the job is an excellent match for the candidate's skills
  - 0.5 means the job is a moderate match
  - 0.0 means the job is not a match at all

  Match Score: